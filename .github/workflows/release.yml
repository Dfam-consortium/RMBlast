name: Release

on:
  push:
    tags:
      # Both tag styles are accepted: the repo's existing bare "3.0.1" and the
      # more common "v3.0.1".  The leading "v" is stripped when deriving VERSION.
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Manual trigger for a build-only smoke test: the archives are attached to the
  # workflow run as artifacts, and the release job is skipped (it is tag-gated).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        run: rustup update stable

      # Each runner builds natively for its own host, so no --target is passed
      # and `make` finds the binaries where it expects them (target/release/).
      # Guard against building the wrong thing on the wrong runner.
      - name: Verify host triple matches the matrix target
        shell: bash
        run: |
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "${HOST}" != "${{ matrix.target }}" ]; then
            echo "runner host triple ${HOST} != matrix target ${{ matrix.target }}" >&2
            exit 1
          fi

      # The version of record lives in rmblastn/Cargo.toml and is what the
      # Makefile stamps into the package directory name.  A tag that disagrees
      # with it would publish an archive whose name contradicts its contents.
      - name: Check tag against Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MAKE_VERSION="$(make version)"
          if [ "${TAG_VERSION}" != "${MAKE_VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} implies version ${TAG_VERSION}," >&2
            echo "but rmblastn/Cargo.toml says ${MAKE_VERSION}." >&2
            echo "Bump Cargo.toml and re-tag, or tag the right commit." >&2
            exit 1
          fi

      # `make dist` runs the release build and stages the same versioned
      # hierarchy that `make install` produces — bin/, wrappers/, docs — so the
      # published archive and a local install are laid out identically.
      # COPYFILE_DISABLE keeps macOS tar from injecting ._ AppleDouble entries.
      - name: Build and package
        shell: bash
        env:
          COPYFILE_DISABLE: '1'
        run: |
          make dist PREFIX=/staging DESTDIR="${PWD}/stage"
          VERSION="$(make version)"
          ARCHIVE="rmblast-${VERSION}-${{ matrix.target }}.tar.gz"
          mv "rmblast-${VERSION}.tar.gz" "${ARCHIVE}"
          echo "ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"

      - name: Smoke-test the packaged binaries
        shell: bash
        run: |
          BIN="stage/staging/rmblast-$(make version)/bin"
          "${BIN}/rmblastn" -version
          "${BIN}/dustmasker" -version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "RMBlast ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*
