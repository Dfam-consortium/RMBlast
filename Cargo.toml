# One version for every crate in the workspace: rmblastn, dustmasker and the
# libraries ship together in a single release, so they share one number.
# Members inherit it with `version.workspace = true`.  This is the version of
# record -- the Makefile reads it and the release workflow checks tags against it.
[workspace.package]
version = "3.0.10"
edition = "2021"
license = "CC0-1.0"

[workspace]
members = [
    "rmblast-lib",
    "rmblastn",
    "dustmasker",
    "rmblast-stats/rmstats",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release-debug]
inherits = "release"
debug = true

[workspace.dependencies]
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
memmap2 = "0.9"
