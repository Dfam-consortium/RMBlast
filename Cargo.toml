# One version for every crate in the workspace: rmblastn, dustmasker and the
# libraries ship together in a single release, so they share one number.
# Members inherit it with `version.workspace = true`.  This is the version of
# record -- the Makefile reads it and the release workflow checks tags against it.
[workspace.package]
version = "3.0.12"
edition = "2021"
license = "CC0-1.0"

[workspace]
members = [
    "rmblast-lib",
    "rmblastn",
    "dustmasker",
    "rmblast-stats/rmstats",
]
resolver = "2"

# Lints that fight a line-by-line port of NCBI's C.  Each is allowed workspace
# wide on purpose; fix anything else clippy reports.
[workspace.lints.clippy]
# NCBI's function signatures are kept, so arguments stay as NCBI passes them
too_many_arguments = "allow"
# index loops mirror the C loops they port, which keeps them easy to compare
needless_range_loop = "allow"
# `!(x <= 0.0)` is NCBI's own form, and it is deliberately true for NaN
neg_cmp_op_on_partial_ord = "allow"
# C `for (i = first; ...) { ... first++; }` sets up the NEXT row; a Rust range
# fixes its start once, exactly like the C, so mutating the bound is intended
mut_range_bound = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release-debug]
inherits = "release"
debug = true

[workspace.dependencies]
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
memmap2 = "0.9"
